spring.application.name=SMART-SCHOOL
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://localhost:3306/smart_school_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=12345

## Hibernate properties
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Enable SQL log output in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Show SQL parameter bindings (values inside ?)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

security.jwt.secret-key=3c1283b9d0344d1b7f225d39999011e86015a1a1f0a2052b65103c81414e05bf
security.jwt.expiration-time=3600000

#================================
# Actuator Setting
#================================

management.endpoints.web.base-path=/sysAdmin
management.endpoints.web.exposure.include=health,info,beans,heapdump,threaddump,mappings,logfile
management.endpoint.health.show-details=always

# Enable SQL script initialization
spring.sql.init.mode=always

# Set defer-datasource-initialization if using Hibernate DDL creation alongside data.sql
spring.jpa.defer-datasource-initialization=true
