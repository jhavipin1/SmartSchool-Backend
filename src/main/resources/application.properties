spring.application.name=SMART-SCHOOL
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://localhost:3306/smart_school_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=12345

## Hibernate properties
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 24h in millisecond
security.jwt.expiration-time=86400000

#================================
# Actuator Setting
#================================

management.endpoints.web.base-path=/sysAdmin
management.endpoints.web.exposure.include=health,info,beans,heapdump,threaddump,mappings,logfile
management.endpoint.health.show-details=always

# Enable SQL script initialization
spring.sql.init.mode=always

# Set defer-datasource-initialization if using Hibernate DDL creation alongside data.sql
spring.jpa.defer-datasource-initialization=true
